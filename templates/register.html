<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
        }

        .register-card{
            border:none;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 25px 50px rgba(0,0,0,.25);
        }

        .left-panel{
            background:linear-gradient(135deg,#2563eb,#06b6d4);
            color:white;
            padding:60px;
        }

        .right-panel{
            background:white;
            padding:50px;
        }

        .logo{
            width:120px;
            height:120px;
            border-radius:50%;
            background:white;
            color:#2563eb;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:60px;
            margin:auto;
            margin-bottom:30px;
        }

        .feature{
            background:rgba(255,255,255,.15);
            padding:15px;
            border-radius:12px;
            margin-top:15px;
        }

        .btn-register{
            background:#198754;
            border:none;
        }

        .btn-register:hover{
            background:#157347;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card register-card">

                <div class="row g-0">

                    <div class="col-md-6">

                        <div class="left-panel h-100">

                            <div class="logo">

                                <i class="bi bi-person-plus-fill"></i>

                            </div>

                            <h1 class="text-center fw-bold">

                                Join The Platform

                            </h1>

                            <p class="text-center">

                                Intelligent Saber 11 Predictor

                            </p>

                            <div class="feature">
                                <i class="bi bi-cpu"></i>
                                Random Forest Regression
                            </div>

                            <div class="feature">
                                <i class="bi bi-graph-up"></i>
                                Linear Regression
                            </div>

                            <div class="feature">
                                <i class="bi bi-bar-chart"></i>
                                Statistics Dashboard
                            </div>

                            <div class="feature">
                                <i class="bi bi-award"></i>
                                Score Prediction System
                            </div>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="right-panel">

                            <h2 class="fw-bold mb-4">

                                Create Account

                            </h2>

                            {% if error %}

                            <div class="alert alert-danger">

                                {{ error }}

                            </div>

                            {% endif %}

                            <form method="POST">

                                <div class="mb-3">

                                    <label class="form-label">

                                        Full Name

                                    </label>

                                    <input
                                        type="text"
                                        name="nombre"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Username

                                    </label>

                                    <input
                                        type="text"
                                        name="usuario"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Email

                                    </label>

                                    <input
                                        type="email"
                                        name="correo"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Password

                                    </label>

                                    <input
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="mb-4">

                                    <label class="form-label">

                                        Confirm Password

                                    </label>

                                    <input
                                        type="password"
                                        name="confirmar"
                                        class="form-control"
                                        required>

                                </div>

                                <div class="d-grid">

                                    <button
                                        class="btn btn-success btn-lg btn-register">

                                        <i class="bi bi-person-check-fill"></i>
                                        Create Account

                                    </button>

                                </div>
{% if mensaje %}

<div class="alert alert-success">

    {{ mensaje }}

</div>

{% endif %}
{% if error %}

<div class="alert alert-danger">

    {{ error }}

</div>

{% endif %}
                            </form>

                            <hr>

                            <div class="text-center">

    <a href="/"
       class="text-decoration-none">

        <i class="bi bi-arrow-left"></i>
        Back To Login

    </a>

</div>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
