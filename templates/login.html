<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intelligent Saber 11 Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#06b6d4);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
        }

        .login-container{
            max-width:1100px;
            width:100%;
        }

        .login-card{
            border:none;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 25px 50px rgba(0,0,0,.25);
        }

        .left-panel{
            background:linear-gradient(135deg,#2563eb,#06b6d4);
            color:white;
            padding:60px;
            height:100%;
        }

        .right-panel{
            background:white;
            padding:60px;
        }

        .logo{
            width:120px;
            height:120px;
            border-radius:50%;
            background:white;
            color:#2563eb;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:60px;
            margin:auto;
            margin-bottom:30px;
        }

        .feature-box{
            background:rgba(255,255,255,.15);
            border-radius:15px;
            padding:15px;
            margin-top:15px;
        }

        .btn-login{
            background:#2563eb;
            border:none;
            padding:12px;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .form-control{
            border-radius:12px;
        }

    </style>

</head>

<body>

<div class="container login-container">

    <div class="card login-card">

        <div class="row g-0">

            <div class="col-md-6">

                <div class="left-panel">

                    <div class="logo">

                        <i class="bi bi-mortarboard-fill"></i>

                    </div>

                    <h1 class="fw-bold text-center">

                        Intelligent Saber 11 Predictor

                    </h1>

                    <p class="text-center mt-3">

                        Machine Learning Based Score Prediction
                        and Model Comparison System

                    </p>

                    <div class="feature-box">

                        <i class="bi bi-cpu-fill"></i>
                        Random Forest Regression

                    </div>

                    <div class="feature-box">

                        <i class="bi bi-graph-up-arrow"></i>
                        Linear Regression

                    </div>

                    <div class="feature-box">

                        <i class="bi bi-bar-chart-fill"></i>
                        Interactive Statistics Dashboard

                    </div>

                    <div class="feature-box">

                        <i class="bi bi-award-fill"></i>
                        Saber 11 Score Prediction

                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="right-panel">

                    <h2 class="fw-bold mb-4">

                        Welcome Back

                    </h2>

                    <p class="text-muted mb-4">

                        Sign in to continue

                    </p>

                    {% if error %}

                    <div class="alert alert-danger">

                        {{ error }}

                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                name="usuario"
                                class="form-control form-control-lg"
                                placeholder="Enter username"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <input
                                    type="password"
                                    id="password"
                                    name="clave"
                                    class="form-control form-control-lg"
                                    placeholder="Enter password"
                                    required>

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    onclick="togglePassword()">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-login btn-lg">

                                <i class="bi bi-box-arrow-in-right"></i>
                                Login

                            </button>

                        </div>
                        <hr>

<div class="text-center mt-3">

    <a href="/register" class="text-decoration-none fw-bold">

        Create Account

    </a>

</div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

function togglePassword(){

    let pass = document.getElementById("password");

    if(pass.type === "password")
        pass.type = "text";
    else
        pass.type = "password";

}

</script>

</body>
</html>
